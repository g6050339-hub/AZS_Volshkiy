<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Мониторинг АЗС и Топлива</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css?v=3.0">
</head>
<body>
  <div id="app">
    <!-- Top Header Bar with City Selector & Fuel Filters -->
    <header class="header">
      <!-- City & Search Row -->
      <div class="top-action-bar">
        <button id="btn-city-select" class="city-pill-btn">
          <span class="city-icon">📍</span>
          <span id="current-city-name" class="city-name-text">Волжский</span>
          <span class="city-arrow">▾</span>
        </button>
        <div class="city-priority-indicator" id="priority-indicator" title="Приоритетный город">⭐</div>
      </div>

      <!-- Filters Scroll -->
      <div class="filters-scroll">
        <button class="filter-pill active" data-fuel="ALL">
          <span>Все АЗС</span>
          <span class="badge" id="count-all">0</span>
        </button>
        <button class="filter-pill" data-fuel="AI95">
          <span class="dot dot-blue"></span>
          <span>АИ-95</span>
          <span class="badge" id="count-ai95">0</span>
        </button>
        <button class="filter-pill" data-fuel="AI95_PREMIUM">
          <span class="dot dot-purple"></span>
          <span>АИ-95+</span>
          <span class="badge" id="count-ai95p">0</span>
        </button>
        <button class="filter-pill" data-fuel="AI92">
          <span class="dot dot-green"></span>
          <span>АИ-92</span>
          <span class="badge" id="count-ai92">0</span>
        </button>
        <button class="filter-pill" data-fuel="AI100">
          <span class="dot dot-red"></span>
          <span>АИ-100</span>
          <span class="badge" id="count-ai100">0</span>
        </button>
        <button class="filter-pill" data-fuel="DIESEL">
          <span class="dot dot-black"></span>
          <span>ДТ</span>
          <span class="badge" id="count-diesel">0</span>
        </button>
      </div>
    </header>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Map Controls (Floating Action Buttons) -->
    <div class="map-controls">
      <button id="btn-locate" class="fab-btn" title="Мое местоположение">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="7"/>
          <line x1="12" y1="1" x2="12" y2="5"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="1" y1="12" x2="5" y2="12"/>
          <line x1="19" y1="12" x2="23" y2="12"/>
        </svg>
      </button>
      <button id="btn-refresh" class="fab-btn" title="Обновить">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
        </svg>
      </button>
    </div>

    <!-- Bottom Sheet / Drawer for Station Details -->
    <div id="drawer" class="drawer">
      <div class="drawer-handle-bar">
        <div class="drawer-handle"></div>
      </div>
      
      <div class="drawer-header">
        <div class="drawer-brand-icon" id="station-brand-icon">⛽</div>
        <div class="drawer-header-info">
          <h2 id="station-name" class="drawer-title">Название АЗС</h2>
          <p id="station-address" class="drawer-address">Адрес заправки</p>
        </div>
        <button id="drawer-close" class="drawer-close-btn">&times;</button>
      </div>

      <!-- Live Queue Card -->
      <div class="queue-card" id="queue-card">
        <div class="queue-card-top">
          <span class="queue-label-title">🚦 Очередь на АЗС:</span>
          <span class="queue-badge q-unknown" id="queue-badge">Обычный поток</span>
        </div>
        <div class="queue-card-detail" id="queue-detail">
          🕒 Данные телеметрии дорожного потока
        </div>
        <div id="queue-warnings" class="queue-warnings"></div>

        <!-- User Crowd-Report Queue Buttons -->
        <div class="user-report-section">
          <span class="user-report-label">Вы на этой АЗС? Сообщите очередь:</span>
          <div class="user-report-buttons">
            <button class="report-btn" data-report="LOW">🟢 Свободно</button>
            <button class="report-btn" data-report="MEDIUM">🟡 5-10 машин</button>
            <button class="report-btn" data-report="HIGH">🔴 Затор</button>
          </div>
        </div>
      </div>

      <!-- Fuel Types Grid -->
      <div class="drawer-content">
        <div class="fuels-title">Наличие топлива и цены</div>
        <div id="fuels-grid" class="fuels-grid">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Action Button: Open in Yandex Maps -->
      <div class="drawer-footer">
        <a id="btn-navigate" href="#" target="_blank" class="btn-primary">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="3 11 22 2 13 21 11 13 3 11"/>
          </svg>
          <span>Маршрут в Яндекс.Картах</span>
        </a>
      </div>
    </div>

    <!-- City Selector Bottom Modal -->
    <div id="city-modal" class="city-modal">
      <div class="city-modal-backdrop" id="city-modal-backdrop"></div>
      <div class="city-modal-sheet">
        <div class="city-modal-handle"></div>
        <div class="city-modal-header">
          <h3>Выбор города</h3>
          <button class="city-modal-close-btn" id="city-modal-close">&times;</button>
        </div>

        <!-- Search Bar -->
        <div class="city-search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="city-search-input" placeholder="Поиск города..." autocomplete="off">
          <button id="city-search-clear" class="search-clear hidden">&times;</button>
        </div>

        <!-- Priority City Switch -->
        <div class="priority-city-box">
          <div class="priority-text-group">
            <span class="priority-title">⭐ Приоритет города</span>
            <span class="priority-subtitle">Всегда открывать этот город первым</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="priority-city-checkbox">
            <span class="slider round"></span>
          </label>
        </div>

        <!-- Cities List -->
        <div class="cities-container" id="cities-container">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <!-- Loading Spinner Overlay -->
    <div id="loader" class="loader-overlay">
      <div class="spinner"></div>
      <div class="loader-text" id="loader-text">Загрузка данных АЗС...</div>
    </div>
  </div>

  <script src="./app.js?v=3.0"></script>
</body>
</html>
